services:
  db:
    image: mysql:8.4
    container_name: pal-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pal_root_pw}
      MYSQL_DATABASE: pal
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"   # host access for local dev / DB tools
    volumes:
      - pal_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: pal-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-pal_root_pw}@db:3306/pal
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@pal.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Super Admin}
      TZ: ${TZ:-Asia/Kolkata}
      MAIL_HOST: ${MAIL_HOST:-mail.palqar.com}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-465}
      NOTIFY_MAIL_USER: ${NOTIFY_MAIL_USER:-}
      NOTIFY_MAIL_PASSWORD: ${NOTIFY_MAIL_PASSWORD:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      MAIL_SECRET_KEY: ${MAIL_SECRET_KEY:-change-me-too}

volumes:
  pal_mysql_data:
